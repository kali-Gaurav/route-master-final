# Testing Configuration

# Layer 1: Dataset Validation
[layer1]
dataset_path = dataset/Clean_Dataset.csv
required_fields = [
    "Train No",
    "Train Name", 
    "Source",
    "Destination",
    "From Station Code",
    "To Station Code",
    "Days Running",
    "Journey Duration"
]
max_missing_fields = 0
max_duplicates = 0
max_validation_errors = 0

# Layer 2: Ingestion Testing
[layer2]
# Test trains for single fetch
single_train_tests = ["16320"]

# Test trains for batch
batch_test_count = 10
batch_trains = [
    "16320",
    "12951", 
    "12627",
    "11016",
    "12559"
]

# Invalid trains to test error handling
invalid_trains = ["99999", "00000", "invalid"]

# Cache configuration
cache_dir = data/raw_rappid
fetch_logs_dir = data/fetch_logs
cache_enabled = true
min_cache_hit_rate = 0.30

# Performance thresholds
max_failed_fetches = 5
max_fetch_retries = 3
fetch_timeout_seconds = 10

# Layer 3: Live Reality Testing
[layer3]
test_trains = [
    "12627",
    "12951",
    "16320",
    "15909",
    "14710"
]

# Comparison thresholds
min_match_percentage = 95
min_station_sequence_match = 0.95
min_time_accuracy = 0.90

# IRCTC API
irctc_api_enabled = false
irctc_base_url = "https://www.irctc.co.in/ntes/default.html"
irctc_timeout_seconds = 10

# Layer 4: Routing Test
[layer4]
# Test scenarios
test_scenarios = [
    {
        "origin": "Bangalore Central",
        "destination": "New Delhi",
        "search_days_ahead": 7
    },
    {
        "origin": "Mumbai Central",
        "destination": "Goa",
        "search_days_ahead": 5
    },
    {
        "origin": "Kolkata",
        "destination": "Bangalore",
        "search_days_ahead": 10
    }
]

# Routing thresholds
min_valid_routes = 1
max_route_duration_hours = 48
min_seat_availability = 1
allow_waitlist_routes = false
min_route_quality_percent = 80

# Booking
enable_booking_simulation = true
test_payment_gateway = false

# Layer 5: Stress & Reliability Testing
[layer5]
# Load testing
total_requests = 1000
concurrent_threads = 10
request_timeout_seconds = 30

# Performance targets
target_p50_response_time_ms = 100
target_p95_response_time_ms = 200
target_p99_response_time_ms = 500
target_success_rate = 0.99
target_cache_hit_rate = 0.30

# Failure recovery
simulate_server_failure = true
failure_recovery_timeout_seconds = 5
max_data_loss_tolerance = 0

# Performance Monitoring
[performance_monitor]
enable_monitoring = true
metrics_collection_interval_seconds = 60

# Thresholds
warning_cpu_percent = 70
critical_cpu_percent = 85

warning_memory_percent = 75
critical_memory_percent = 90

warning_response_time_ms = 300
critical_response_time_ms = 1000

warning_cache_hit_rate = 0.30
critical_cache_hit_rate = 0.10

warning_error_rate_percent = 1.0
critical_error_rate_percent = 5.0

# Data freshness
warning_data_freshness_minutes = 60
critical_data_freshness_minutes = 120

# Optimization Rules
[optimization]
auto_tuning_enabled = true

cache_size_initial_mb = 100
cache_size_max_mb = 2000
cache_ttl_initial_seconds = 300
cache_ttl_max_seconds = 3600

worker_threads_initial = 4
worker_threads_max = 16

query_timeout_seconds = 5

# Reporting
[reporting]
output_format = "json"
save_reports = true
reports_dir = "test_reports"

# Individual layer report files
layer1_report = "test_layer1_report.json"
layer2_report = "test_layer2_report.json"
layer3_report = "test_layer3_report.json"
layer4_report = "test_layer4_report.json"
layer5_report = "test_layer5_report.json"

# Master report
master_report = "test_master_report.json"

# Performance report
performance_report = "performance_metrics.json"

# Archiving old reports
archive_old_reports = true
archive_reports_older_than_days = 30

# Alerting
[alerting]
enable_alerts = true
alert_on_failure = true
alert_on_warning = false

# Alert destinations
slack_webhook_url = ""
email_recipients = []
pagerduty_integration_key = ""

# Thresholds for alerts
alert_when_layer_fails = true
alert_when_success_rate_below_percent = 95
alert_when_response_time_exceeds_ms = 500
alert_when_error_rate_exceeds_percent = 2

# CI/CD Integration
[cicd]
fail_build_on_layer_fail = true
fail_build_on_critical_issues = true
warn_build_on_warnings = false

# GitHub Actions
github_actions_enabled = false
upload_artifacts = true
artifact_retention_days = 30
