name: Deploy to Staging
on:
  push:
    branches: [develop]
  workflow_run:
    workflows: [Testing Pipeline, Build and Push Docker Images]
    types: [completed]
    branches: [develop]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    environment:
      name: staging
      url: https://staging-api.railway-os.local
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
          aws-region: us-east-1
      
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition-staging.json
          container-name: railway-os-api
          image: ${{ secrets.AWS_ECR_REGISTRY }}/railway-os:${{ github.sha }}
      
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: railway-os-staging
          cluster: railway-os-staging
          wait-for-service-stability: true
      
      - name: Run smoke tests
        env:
          API_URL: https://staging-api.railway-os.local
        run: |
          pip install requests pytest
          pytest tests/smoke_tests -v --tb=short
      
      - name: Notify deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Deployed to staging: ${{ github.sha }}'
            })

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: failure()
    steps:
      - name: Trigger rollback
        run: |
          echo "Deployment failed - rolling back to previous stable version"
          # In production: kubectl rollout undo deployment/railway-os-staging -n staging
