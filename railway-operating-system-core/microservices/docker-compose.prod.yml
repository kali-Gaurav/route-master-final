version: '3.8'

services:
  # PostgreSQL Database - Production
  postgres:
    image: postgres:15-alpine
    container_name: railway-os-postgres-prod
    environment:
      POSTGRES_DB: railway_os
      POSTGRES_USER: ${DB_USER:-railway_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - railway-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-railway_user} -d railway_os"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Redis - Production
  redis:
    image: redis:7-alpine
    container_name: railway-os-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_prod_data:/data
    networks:
      - railway-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # RabbitMQ - Production
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: railway-os-rabbitmq-prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-railway_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    networks:
      - railway-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 60s

  # API Gateway - Production
  api-gateway:
    image: railway-os/api-gateway:latest
    environment:
      - ENVIRONMENT=production
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ROUTE_SERVICE_URL=http://route-service:8002
      - DATA_SERVICE_URL=http://data-service:8003
      - WORKER_SERVICE_URL=http://worker-service:8004
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.railwayos.com}
    ports:
      - "443:8000"
    depends_on:
      auth-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
      worker-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - railway-network
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Auth Service - Production
  auth-service:
    image: railway-os/auth-service:latest
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-railway_user}:${DB_PASSWORD}@postgres:5432/railway_os
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - railway-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Route Service - Production
  route-service:
    image: railway-os/route-service:latest
    environment:
      - ENVIRONMENT=production
      - DATA_SERVICE_URL=http://data-service:8003
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    ports:
      - "8002:8002"
    depends_on:
      data-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - railway-network
    deploy:
      replicas: 5
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Data Service - Production
  data-service:
    image: railway-os/data-service:latest
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-railway_user}:${DB_PASSWORD}@postgres:5432/railway_os
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - railway-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Worker Service - Production
  worker-service:
    image: railway-os/worker-service:latest
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-railway_user}:${DB_PASSWORD}@postgres:5432/railway_os
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-railway_user}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      - DATA_SERVICE_URL=http://data-service:8003
      - ROUTE_SERVICE_URL=http://route-service:8002
      - LOG_LEVEL=INFO
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      data-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
    networks:
      - railway-network
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "pgrep", "-f", "celery"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  # Analytics Service - Production
  analytics-service:
    image: railway-os/analytics-service:latest
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${DB_USER:-railway_user}:${DB_PASSWORD}@postgres:5432/railway_os
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      data-service:
        condition: service_healthy
      route-service:
        condition: service_healthy
    networks:
      - railway-network
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '0.75'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy (Optional - for SSL termination)
  nginx:
    image: nginx:alpine
    container_name: railway-os-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-gateway
    networks:
      - railway-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  rabbitmq_prod_data:
    driver: local

networks:
  railway-network:
    driver: overlay
    attachable: true

# ===============================================
# DEPLOYMENT CONFIGURATIONS
# ===============================================

# Health check configurations
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 30s

# Common service configuration
x-service-config: &service-config
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '0.5'
      reservations:
        memory: 256M
        cpus: '0.25'
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
      window: 120s
  networks:
    - railway-network